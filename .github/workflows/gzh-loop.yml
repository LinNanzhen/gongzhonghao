name: gzh-loop

# 多智能体事件循环（SOP v9）：
#   - 定时：每 2 小时扫描 sources.json 与 inbox/
#   - 手动：Actions 页面 Run workflow
#   - 外部：repository_dispatch（type = gzh-inbox）
#
# 设计约束：
#   * 只推进，不发布。到达 awaiting_publish 就停，等人 approve。
#   * 状态与产物都提交回仓库，git log 即审计日志。
#   * 任何一步 FAIL 都保留现场，不静默跳过。

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      scan:
        description: "扫描 sources.json（关闭则只处理 inbox）"
        type: boolean
        default: true
      max_runs:
        description: "本轮最多推进几个 run"
        default: "3"
      provider:
        description: "LLM 供应商（stub 不调模型，只跑骨架）"
        type: choice
        default: stub
        options: [stub, deepseek, kimi, qwen, openai]
      model:
        description: "模型名（留空则用该供应商默认）"
        default: ""
      smoke:
        description: "只做一次模型连通性自检，不推进任务"
        type: boolean
        default: false
      approve_run_id:
        description: "放行指定 run（留空则正常推进）"
        default: ""
      approve_gate:
        description: "放行的闸门（选 none 表示不放行）"
        type: choice
        default: none
        options: [none, topic, publish]
  repository_dispatch:
    types: [gzh-inbox]

permissions:
  contents: write

concurrency:
  group: gzh-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      # 案例目录落在仓库内，云端才能提交回写；本地运行时默认是仓库父目录
      GZH_BASE: ${{ github.workspace }}/cases
      PYTHONIOENCODING: utf-8
      MAX_RUNS: ${{ github.event.inputs.max_runs || '3' }}
      PROVIDER: ${{ github.event.inputs.provider || 'stub' }}
      RUN_ID: ${{ github.event.inputs.approve_run_id }}
      GATE: ${{ github.event.inputs.approve_gate }}
      # 接真实模型时在仓库 Settings → Secrets 里配 GZH_LLM_API_KEY
      # 推荐 GZH_LLM_API_KEY；历史仓库里若叫 DEEPSEEK 也能取到
      GZH_LLM_API_KEY: ${{ secrets.GZH_LLM_API_KEY || secrets.DEEPSEEK }}
      GZH_LLM_MODEL: ${{ github.event.inputs.model || vars.GZH_LLM_MODEL }}
      GZH_LLM_BASE_URL: ${{ vars.GZH_LLM_BASE_URL }}
      YT_COOKIES_FILE: /tmp/yt-cookies.txt

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 单元测试（快，失败即停）
        run: python3 -m unittest orchestrator.test_state orchestrator.test_provider -q

      - name: 准备 YouTube cookies（可选）
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > /tmp/yt-cookies.txt
            echo "cookies 已写入（$(wc -l < /tmp/yt-cookies.txt) 行）"
          else
            echo "未配置 YT_COOKIES，自动抓字幕时会退回 blocked"
          fi
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: 安装转写工具（best-effort）
        # 装不上不该拖垮整轮：yt-dlp 拿不到就落 blocked，由前面已配的转写兜底
        run: |
          timeout 90 python3 -m pip install -q --upgrade yt-dlp \
            || echo "::warning::yt-dlp 安装超时，本轮跳过自动抓字幕"
          if command -v ffmpeg >/dev/null; then
            echo "ffmpeg 已存在"
          else
            timeout 120 sudo apt-get install -y -qq ffmpeg \
              || echo "::warning::ffmpeg 安装失败，字幕转换可能不可用"
          fi
          timeout 15 yt-dlp --version || echo "yt-dlp 不可用"

      - name: 模型自检（可选）
        if: inputs.smoke == true
        run: python3 orchestrator/loop.py ping --provider "$PROVIDER"

      - name: 人工放行（可选）
        if: inputs.approve_run_id != '' && inputs.approve_gate != 'none'
        run: |
          echo "放行 $RUN_ID 的 $GATE 闸门"
          python3 orchestrator/loop.py approve --run-id "$RUN_ID" --gate "$GATE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 推进一轮
        if: inputs.smoke != true
        run: |
          mkdir -p "$GZH_BASE"
          SCAN_FLAG="--scan"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scan }}" = "false" ]; then
            SCAN_FLAG=""
          fi
          python3 orchestrator/loop.py tick --max-runs "$MAX_RUNS" --provider "$PROVIDER" $SCAN_FLAG \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 当前状态
        if: always()
        run: |
          echo '### run 状态' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 orchestrator/loop.py status >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 提交回写
        run: |
          git config user.name  "gzh-loop[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(loop): tick 回写 $(date -u +%FT%TZ)"
            git push
          fi
