<!--
  人物简介卡模板 · 文字版（SOP v10 · 2026-11-10）
  用途：访谈类稿件开头的身份说明卡，有几个人物复制几块（采访者也要有）。
  与旧履历卡（人物卡片_壹伴.html）的区别：标签式 3—5 行，不写完整生平，默认无头像。
  规则：
    1. 每个字段必须进事实台账；查不到整行删掉，不留空、不靠印象补、不堆头衔奖项
    2. 卡面给出全名↔缩写对照，正文对话行才能只用缩写（如 > IS：……）
    3. 只用 section/p/span 与内联样式；禁用 div/class/id/flex/position/渐变
    4. 字号下限：姓名 ≥18px、身份行 ≥13px、条目 ≥15px
    5. 【】为占位符，正式稿不得残留
-->
